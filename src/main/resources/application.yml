spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

codeq:
  scan:
    thread-pool-size: ${CODEQ_SCAN_POOL:4}
  retention:
    days: ${CODEQ_RETENTION_DAYS:30}

logging:
  level:
    com.codeq: INFO

---
# dev profile（默认）：H2 内存 + 彩色 console 日志
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:codeq;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

---
# prod profile：PostgreSQL + JSON 日志（宪法 VIII）
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeq}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:codeq}
    password: ${DB_PASSWORD:codeq}
  jpa:
    hibernate:
      ddl-auto: validate
